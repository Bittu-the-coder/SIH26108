services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sih26108
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sih_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih26108"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c effective_cache_size=128MB
        -c max_connections=20
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 48M

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: --model-id BAAI/bge-small-en-v1.5 --max-batch-tokens 4096
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: ./backend
    command: bash -c "python create_tables.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sih:${DB_PASSWORD:-sih_password}@db:5432/sih26108
      REDIS_URL: redis://redis:6379
      BGE_INFERENCE_URL: http://tei:80/embed
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          memory: 192M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  pgdata:
