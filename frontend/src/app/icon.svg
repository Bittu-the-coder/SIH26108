<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Hexagonal Shield / Standards Gauge -->
  <rect
    x="2"
    y="2"
    width="36"
    height="36"
    rx="9"
    fill="#171717"
    stroke="#262626"
    stroke-width="1.5"
  />

  <!-- Outer precision grid lines -->
  <circle cx="20" cy="20" r="13" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- The 'IS' Interlocking Monogram in electric blue -->
  <path
    d="M20 9L29 20L20 31L11 20L20 9Z"
    stroke="#0070f3"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Central Core AI Dot -->
  <circle cx="20" cy="20" r="4" fill="#ffffff" />
  <circle cx="20" cy="20" r="1.8" fill="#171717" />

  <!-- Corner alignment crosshairs -->
  <line x1="20" y1="4" x2="20" y2="8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="20" y1="32" x2="20" y2="36" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="4" y1="20" x2="8" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="20" x2="36" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
</svg>
